# Temporary (removed before merge): measures whether GitHub's runners can read Workday postings.
name: Workday probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: Workday probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/workday-probe.mjs
